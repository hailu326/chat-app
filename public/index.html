<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#00a884">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>HAILACHO_Chat_App</title>
</head>
<body>

<!-- NOTE: no inline onclick="" anywhere. All events are attached in main.js
     (this lets the server use a strict Content-Security-Policy). -->
<div class="container logged-out">

    <!-- SIGNUP PAGE -->
    <div id="signup-page">
        <h2>signup</h2>
        <form id="signup-form" novalidate>
            <div class="profile-upload">
                <label for="file-input">
                    <img src="/default-avatar.svg" alt="" id="preview" class="signup-avatar">
                </label>
                <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif">
                <p>select profile photo</p>
            </div>

            <input type="text" id="username" placeholder="full name" maxlength="50" autocomplete="name" required>
            <input type="tel" id="phone" placeholder="phone number" maxlength="16" autocomplete="tel">
            <input type="email" id="email" placeholder="email address" maxlength="254" autocomplete="email" required>
            <input type="password" id="password" placeholder="password" maxlength="72" autocomplete="new-password" required>
            <input type="password" id="confirm-password" placeholder="confirm password" maxlength="72" autocomplete="new-password" required>
            <p class="form-error" id="signup-error"></p>
            <button type="submit">create account</button>
        </form>
        <p>already have an account? <a href="#" id="link-login">login here</a></p>
    </div>

    <!-- LOGIN PAGE -->
    <div id="login-page" style="display:none;">
        <h2>Login</h2>
        <form id="login-form" novalidate>
            <input type="email" id="login-email" placeholder="Email Address" maxlength="254" autocomplete="email" required>
            <input type="password" id="login-password" placeholder="Password" maxlength="128" autocomplete="current-password" required>
            <p class="form-error" id="login-error"></p>
            <button type="submit">Login</button>
        </form>
        <p>New here? <a href="#" id="link-signup">Signup here</a></p>
    </div>

    <!-- CHAT LIST (BITAA) -->
    <div id="user-list-page">
        <div class="app-header">
            <img src="/default-avatar.svg" id="my-profile-img" class="header-avatar" alt="">
            <h2>Chats</h2>
            <button type="button" class="icon-btn" id="edit-profile-btn" title="Edit profile"><i class="fas fa-user-pen"></i></button>
            <button type="button" class="icon-btn" id="logout-btn" title="Log out"><i class="fas fa-right-from-bracket"></i></button>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search people by name..." id="search-input" maxlength="50" autocomplete="off">
        </div>

        <ul id="users-online" class="friend-list"></ul>
    </div>

    <!-- CHAT ROOM (MIRGA) -->
    <div class="app-container">
        <div class="main no-chat">

            <div class="chat-empty" id="chat-empty">
                <i class="fa-regular fa-comments"></i>
                <p>Select a chat or search a person to start a private conversation</p>
            </div>

            <div class="chat-header">
                <button type="button" class="icon-btn" id="back-btn" title="Back"><i class="fas fa-arrow-left"></i></button>
                <img src="/default-avatar.svg" id="chat-avatar" class="header-avatar" alt="">
                <div class="header-info">
                    <h4 id="chat-with-name">Username</h4>
                    <p id="chat-status" class="header-status"></p>
                </div>
                <div class="call-buttons">
                    <button type="button" id="voice-call-btn" title="Voice call">📞</button>
                    <button type="button" id="video-call-btn" title="Video call">🎥</button>
                </div>
            </div>

            <ul class="message-container" id="message-container"></ul>

            <!-- FILE PREVIEW (after you choose a file) -->
            <div class="file-preview" id="file-preview">
                <div id="file-preview-thumb">📄</div>
                <div class="file-preview-info">
                    <div id="file-preview-name"></div>
                    <div id="file-preview-size"></div>
                </div>
                <button type="button" id="file-preview-cancel" title="Remove file">✖</button>
            </div>

            <form class="message-form" id="message-form">
                <label for="attachment-file-input" class="file-icon" title="Attach a file">
                    <i class="fa fa-paperclip"></i>
                </label>
                <input type="file" id="attachment-file-input">

                <input type="text" id="message-input" class="message-input" placeholder="Type a message..." maxlength="4000" autocomplete="off">

                <button type="submit" class="send-button" title="Send">
                    <span><i class="fa-solid fa-paper-plane"></i></span>
                </button>
            </form>
        </div>
    </div>

</div>

<!-- EDIT PROFILE MODAL -->
<div id="edit-profile-modal" class="modal">
    <div class="modal-card">
        <h3>Edit Your Profile</h3>

        <label for="edit-file-input">
            <img id="edit-preview" src="/default-avatar.svg" alt="" class="edit-avatar">
        </label>
        <input type="file" id="edit-file-input" accept="image/png,image/jpeg,image/webp,image/gif">
        <p class="hint">Click the image to change it</p>

        <label class="field-label" for="edit-name-input">Full Name</label>
        <input type="text" id="edit-name-input" maxlength="50">

        <label class="field-label" for="edit-phone-input">Phone number</label>
        <input type="tel" id="edit-phone-input" maxlength="16">

        <label class="field-label" for="edit-current-password">Current password (only to change password)</label>
        <input type="password" id="edit-current-password" maxlength="128" autocomplete="current-password">

        <label class="field-label" for="edit-new-password">New password (optional)</label>
        <input type="password" id="edit-new-password" maxlength="72" autocomplete="new-password">

        <p class="form-error" id="edit-error"></p>

        <div class="modal-actions">
            <button type="button" id="save-edit-btn" class="ok">Save Changes</button>
            <button type="button" id="cancel-edit-btn" class="cancel">Cancel</button>
        </div>
    </div>
</div>

<audio id="message-tone" src="universfield-new-notification-021-370045.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>

</body>
</html>
